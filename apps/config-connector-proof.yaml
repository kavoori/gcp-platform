# Proof that a Kubernetes object becomes a Google resource: one namespace and one topic, from
# scratch/config-connector-proof/. Removed once seen to work.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config-connector-proof
  namespace: argocd
  finalizers:
    # Deleting this Application deletes the namespace and the topic object, and Config Connector
    # then deletes the topic in Google. That deletion is half of what is being proved.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kavoori/gcp-platform.git
    targetRevision: main
    path: scratch/config-connector-proof
  destination:
    server: https://kubernetes.default.svc
    namespace: config-connector-proof
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
