# The one object that tells the Config Connector add-on how to behave, from config-connector/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config-connector
  namespace: argocd
  finalizers:
    # Deleting this Application deletes the object, and the operator then puts its own default
    # back: namespaced mode, no identity, no controller. That is a real removal, not an orphan.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kavoori/gcp-platform.git
    targetRevision: main
    path: config-connector
  destination:
    server: https://kubernetes.default.svc
    # The object is cluster-scoped. A namespace is still required here; this is where the
    # operator runs the controller the object configures.
    namespace: cnrm-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The operator created this object before Argo CD did, and owns its fields. Server-side
      # apply lets Argo CD take those fields over rather than refuse the conflict.
      - ServerSideApply=true
